spring:
  application:
    name: CollegeSquire

  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/CollegeSquire
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

collegesquire:
  coordenacao:
    email: ${COORDENACAO_EMAIL:coordenacao@collegesquire.com}
    senha: ${COORDENACAO_SENHA}
