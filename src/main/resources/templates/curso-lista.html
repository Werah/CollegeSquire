<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}" lang="pt-br">
<body>

<div layout:fragment="conteudo">

    <div class="admin-toolbar">
        <h2>Cursos cadastrados</h2>
        <a class="btn btn-primario" th:href="@{/cursos/novo}">+ Inserir</a>
    </div>

    <table class="tabela-grade" th:if="${not #lists.isEmpty(cursos)}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Sigla</th>
            <th class="col-acoes"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cursos}">
            <td th:text="${c.nome}"></td>
            <td th:text="${c.sigla}"></td>
            <td class="col-acoes">
                <a class="btn-icone" th:href="@{/cursos/editar/{id}(id=${c.id})}" title="Editar">&#9998;</a>
                <a class="btn-icone excluir" th:href="@{/cursos/deletar/{id}(id=${c.id})}" title="Excluir"
                   onclick="return confirm('Excluir este registro?')">&#10006;</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="tabela-vazia" th:if="${#lists.isEmpty(cursos)}">Nenhum curso cadastrado ainda.</p>

</div>

</body>
</html>
