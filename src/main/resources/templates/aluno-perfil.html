<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'College Squire - ' + ${aluno.nome}">College Squire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="app-shell">

    <div class="fundo-padrao"></div>

    <header class="app-header">
        <div th:replace="~{fragments/brasao :: brasao-link}"></div>
        <div class="marca">
            <strong th:text="${aluno.nome}"></strong>
            <span th:text="${aluno.curso != null ? aluno.curso.nome : ''}"></span>
        </div>
        <div class="usuario">
            <a class="btn-sair" th:href="@{/alunos/editar/{id}(id=${aluno.id})}">Editar cadastro</a>
            <a class="btn-sair" th:href="@{/alunos}">Voltar</a>
        </div>
    </header>

    <nav th:replace="~{fragments/nav :: menu}"></nav>

    <main class="app-content">

        <section class="painel">
            <h2>Dados cadastrais</h2>
            <div class="perfil-info">
                <div><span>Matricula</span><strong th:text="${aluno.matricula}"></strong></div>
                <div><span>CPF</span><strong th:text="${aluno.cpf}"></strong></div>
                <div><span>E-mail</span><strong th:text="${aluno.email}"></strong></div>
                <div><span>Telefone</span><strong th:text="${aluno.telefone}"></strong></div>
                <div><span>Endereco</span><strong th:text="${aluno.endereco}"></strong></div>
                <div><span>Curso</span><strong th:text="${aluno.curso != null ? aluno.curso.nome : '-'}"></strong></div>
                <div><span>Turma</span><strong th:text="${aluno.turma != null ? 'Turma ' + aluno.turma.numero : '-'}"></strong></div>
            </div>
        </section>

        <section class="painel">
            <h2>Notas e faltas por disciplina</h2>

            <p class="tabela-vazia" th:if="${#lists.isEmpty(resumoDisciplinas)}">
                Nenhuma disciplina encontrada para a turma deste aluno.
            </p>

            <div class="turma-resumo" th:each="r : ${resumoDisciplinas}">
                <div class="turma-resumo-cabecalho">
                    <div>
                        <strong th:text="${r.disciplina.nome}"></strong>
                        <span th:text="${r.disciplina.professor != null ? r.disciplina.professor.nome : ''}"></span>
                    </div>
                    <div class="turma-resumo-metricas">
                        <span class="metrica">
                            Media: <strong th:text="${r.media != null ? #numbers.formatDecimal(r.media,1,1) : '-'}"></strong>
                        </span>
                        <span class="metrica">
                            Presenca: <strong th:text="${#numbers.formatDecimal(r.percentualPresenca,1,1)} + '%'"></strong>
                        </span>
                        <span class="metrica">
                            Faltas: <strong th:text="${r.faltas} + '/' + ${r.totalAulas}"></strong>
                        </span>
                    </div>
                </div>

                <table class="tabela-grade" th:if="${not #lists.isEmpty(r.notas)}">
                    <thead>
                    <tr>
                        <th>Avaliacao</th>
                        <th>Tipo</th>
                        <th>Peso</th>
                        <th>Nota</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="n : ${r.notas}">
                        <td th:text="${n.descricao}"></td>
                        <td th:text="${n.tipo}"></td>
                        <td th:text="${n.peso}"></td>
                        <td th:text="${n.valor}"></td>
                    </tr>
                    </tbody>
                </table>
                <p class="tabela-vazia" th:if="${#lists.isEmpty(r.notas)}">Nenhuma nota lancada ainda.</p>
            </div>
        </section>

    </main>

</div>

</body>
</html>
