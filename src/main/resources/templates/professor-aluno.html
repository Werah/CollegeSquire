<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'College Squire - ' + ${aluno.nome}">College Squire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app-shell">

    <div class="fundo-padrao"></div>

    <header class="app-header">
        <div th:replace="~{fragments/brasao :: brasao}"></div>
        <div class="marca">
            <strong th:text="${aluno.nome}"></strong>
            <span th:text="${disciplina.nome} + (${disciplina.turma} != null ? ' - Turma ' + ${disciplina.turma.numero} : '')"></span>
        </div>
        <div class="usuario">
            <a class="btn-sair" th:href="@{/professor/disciplinas/{id}(id=${disciplina.id})}">Voltar</a>
        </div>
    </header>

    <main class="app-content">

        <section class="painel">
            <h2>Dados do aluno</h2>
            <div class="perfil-info">
                <div><span>Matricula</span><strong th:text="${aluno.matricula}"></strong></div>
                <div><span>CPF</span><strong th:text="${aluno.cpf}"></strong></div>
                <div><span>E-mail</span><strong th:text="${aluno.email}"></strong></div>
                <div><span>Telefone</span><strong th:text="${aluno.telefone}"></strong></div>
                <div><span>Endereco</span><strong th:text="${aluno.endereco}"></strong></div>
                <div><span>Curso</span><strong th:text="${aluno.curso != null ? aluno.curso.nome : '-'}"></strong></div>
            </div>
        </section>

        <section class="painel">
            <h2>Notas nesta disciplina</h2>

            <table class="tabela-grade" th:if="${not #lists.isEmpty(notas)}">
                <thead>
                <tr>
                    <th>Avaliacao</th>
                    <th>Tipo</th>
                    <th>Peso</th>
                    <th>Nota</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="n : ${notas}">
                    <td th:text="${n.descricao}"></td>
                    <td th:text="${n.tipo}"></td>
                    <td th:text="${n.peso}"></td>
                    <td th:text="${n.valor}"></td>
                </tr>
                </tbody>
            </table>

            <p class="tabela-vazia" th:if="${#lists.isEmpty(notas)}">Nenhuma nota lancada ainda.</p>
        </section>

        <section class="painel">
            <h2>Frequencia nesta disciplina</h2>

            <table class="tabela-grade" th:if="${not #lists.isEmpty(frequencias)}">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Presenca</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${frequencias}">
                    <td th:text="${f.data}"></td>
                    <td th:text="${f.presente} ? 'Presente' : 'Falta'"></td>
                </tr>
                </tbody>
            </table>

            <p class="tabela-vazia" th:if="${#lists.isEmpty(frequencias)}">Nenhuma frequencia lancada ainda.</p>
        </section>

    </main>

</div>

</body>
</html>
