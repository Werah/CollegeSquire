<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}" lang="pt-br">
<body>

<div layout:fragment="conteudo">

    <div class="admin-toolbar">
        <h2>Salas cadastradas</h2>
        <a class="btn btn-primario" th:href="@{/salas/novo}">Inserir</a>
    </div>

    <table class="tabela-grade" th:if="${not #lists.isEmpty(salas)}">
        <thead>
        <tr>
            <th>Numero</th>
            <th>Predio</th>
            <th class="col-acoes"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${salas}">
            <td th:text="${s.numero}"></td>
            <td th:text="${s.predio}"></td>
            <td class="col-acoes">
                <a class="btn-icone" th:href="@{/salas/editar/{id}(id=${s.id})}" title="Editar">&#9998;</a>
                <a class="btn-icone excluir" th:href="@{/salas/deletar/{id}(id=${s.id})}" title="Excluir"
                   onclick="return confirm('Excluir este registro?')">&#10006;</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="tabela-vazia" th:if="${#lists.isEmpty(salas)}">Nenhuma sala cadastrada ainda.</p>

</div>

</body>
</html>
