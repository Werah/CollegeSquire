<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'College Squire - Notas - ' + ${disciplina.nome}">College Squire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="app-shell">

    <div class="fundo-padrao"></div>

    <header class="app-header">
        <div th:replace="~{fragments/brasao :: brasao-link}"></div>
        <div class="marca">
            <strong th:text="${disciplina.nome}"></strong>
            <span>Lancar notas</span>
        </div>
        <div class="usuario">
            <th:block th:replace="~{fragments/usuario :: identificacao}"></th:block>
            <a class="btn-sair" th:href="@{/professor/disciplinas/{id}(id=${disciplina.id})}">Voltar</a>
            <a th:replace="~{fragments/usuario :: sair}"></a>
        </div>
    </header>

    <nav th:replace="~{fragments/nav :: menu}"></nav>

    <main class="app-content">

        <section class="painel">

            <form th:action="@{/professor/disciplinas/{id}/notas(id=${disciplina.id})}" method="post"
                  data-validar-form data-pelo-menos-um="valores"
                  data-mensagem-grupo="Nota não preenchida: informe a nota de pelo menos um aluno">

                <div class="lancar-shell">

                    <div class="lancar-config">
                        <h2>Avaliacao</h2>
                        <div class="input-group">
                            <label>Descricao</label>
                            <input type="text" name="descricao" placeholder="Prova 1" required>
                        </div>
                        <div class="input-group">
                            <label>Tipo</label>
                            <input type="text" name="tipo" placeholder="Prova" required>
                        </div>
                        <div class="input-group">
                            <label>Peso</label>
                            <input type="number" step="0.1" name="peso" value="1" required>
                        </div>
                        <button type="submit" class="btn btn-primario" th:if="${not #lists.isEmpty(alunos)}">Lancar notas</button>
                    </div>

                    <div class="lancar-alunos">
                        <h2>Alunos</h2>

                        <div class="aviso-grupo"></div>

                        <table class="tabela-grade" th:if="${not #lists.isEmpty(alunos)}">
                            <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Matricula</th>
                                <th>Nota</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="a : ${alunos}">
                                <td th:text="${a.nome}"></td>
                                <td th:text="${a.matricula}"></td>
                                <td>
                                    <input type="hidden" name="alunoIds" th:value="${a.id}">
                                    <input type="number" step="0.1" min="0" name="valores" placeholder="-" data-opcional>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <p class="tabela-vazia" th:if="${#lists.isEmpty(alunos)}">Nenhum aluno matriculado nesta turma.</p>
                    </div>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="/js/validacao-form.js"></script>

</body>
</html>
