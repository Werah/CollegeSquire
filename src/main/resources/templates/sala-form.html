<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}" lang="pt-br">
<body>

<div layout:fragment="conteudo">

    <div class="admin-form">
        <h2 th:text="${sala.id} != null ? 'Editar sala' : 'Nova sala'"></h2>

        <form th:action="@{/salas}" th:object="${sala}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="input-group">
                <label>Numero</label>
                <input type="number" th:field="*{numero}" required>
            </div>
            <div class="input-group">
                <label>Predio</label>
                <input type="number" th:field="*{predio}" required>
            </div>
            <div class="botoes">
                <button type="submit" class="btn btn-primario">Salvar</button>
                <a class="btn btn-secundario" th:href="@{/salas}">Cancelar</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
