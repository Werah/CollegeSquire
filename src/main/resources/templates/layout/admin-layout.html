<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - College Squire">College Squire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="app-shell">

    <div class="fundo-padrao"></div>

    <header class="app-header">
        <div th:replace="~{fragments/brasao :: brasao}"></div>
        <div class="marca">
            <strong th:text="${tituloPagina}">Titulo</strong>
            <span>Sistema de gestao academica</span>
        </div>
        <div class="usuario">
            <a class="btn-sair" th:href="@{/home}">Voltar</a>
        </div>
    </header>

    <main class="app-content">
        <section class="painel">
            <div layout:fragment="conteudo">
                Conteudo
            </div>
        </section>
    </main>

</div>

</body>
</html>
