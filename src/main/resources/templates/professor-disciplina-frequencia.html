<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'College Squire - Faltas - ' + ${disciplina.nome}">College Squire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="app-shell">

    <div class="fundo-padrao"></div>

    <header class="app-header">
        <div th:replace="~{fragments/brasao :: brasao-link}"></div>
        <div class="marca">
            <strong th:text="${disciplina.nome}"></strong>
            <span>Lancar faltas</span>
        </div>
        <div class="usuario">
            <a class="btn-sair" th:href="@{/professor/disciplinas/{id}(id=${disciplina.id})}">Voltar</a>
        </div>
    </header>

    <nav th:replace="~{fragments/nav :: menu}"></nav>

    <main class="app-content">

        <section class="painel">

            <p class="tabela-vazia" th:if="${maxPeriodos == 0}">
                Esta disciplina ainda nao tem nenhum horario definido na grade curricular.
                Peca para a coordenacao cadastrar a grade da turma antes de lancar faltas.
            </p>

            <form th:if="${maxPeriodos > 0}" th:action="@{/professor/disciplinas/{id}/frequencia(id=${disciplina.id})}" method="post">

                <div class="lancar-shell">

                    <div class="lancar-config">
                        <h2>Data da aula</h2>

                        <div class="calendario">
                            <div class="calendario-cabecalho">
                                <button type="button" id="mesAnterior">&#8249;</button>
                                <span id="calendarioTitulo"></span>
                                <button type="button" id="proximoMes">&#8250;</button>
                            </div>
                            <div class="calendario-dias-semana">
                                <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                            </div>
                            <div class="calendario-grade" id="calendarioGrade"></div>
                        </div>

                        <input type="hidden" name="data" id="dataSelecionada">
                        <div class="calendario-data-selecionada">
                            Data selecionada
                            <strong id="dataSelecionadaTexto"></strong>
                            <div id="infoPeriodos" style="margin-top:6px; font-size:12.5px; color: var(--cinza-500);"></div>
                        </div>
                    </div>

                    <div class="lancar-alunos">
                        <h2>Alunos</h2>

                        <table class="tabela-grade" th:if="${not #lists.isEmpty(alunos)}">
                            <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Matricula</th>
                                <th>Presenca</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="a : ${alunos}">
                                <td th:text="${a.nome}"></td>
                                <td th:text="${a.matricula}"></td>
                                <td class="col-check">
                                    <div class="check-periodo-grupo">
                                        <span th:each="p : ${periodos}">
                                            <span class="periodo-numero" th:text="${p}"></span>
                                            <input type="checkbox" class="check-periodo" th:attr="data-periodo=${p}"
                                                   name="presentes" th:value="${a.id} + ':' + ${p}" checked>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <p class="tabela-vazia" th:if="${#lists.isEmpty(alunos)}">Nenhum aluno matriculado nesta turma.</p>

                        <button type="submit" class="btn btn-primario" style="margin-top:16px;" th:if="${not #lists.isEmpty(alunos)}">Lancar faltas</button>
                    </div>

                </div>

            </form>

        </section>

    </main>

</div>

<script th:if="${maxPeriodos > 0}" th:inline="javascript">
    var diasPermitidos = /*[[${diasPermitidos}]]*/ [];
    var periodosPorDiaSemana = /*[[${periodosPorDiaSemana}]]*/ {};
</script>
<script th:if="${maxPeriodos > 0}" src="/js/calendario.js"></script>
<script th:if="${maxPeriodos > 0}">
    function atualizarPeriodosVisiveis(data, diaSemana) {
        var totalHoje = (diaSemana !== null && diaSemana !== undefined) ? (periodosPorDiaSemana[diaSemana] || 0) : 0;
        var info = document.getElementById('infoPeriodos');

        info.textContent = totalHoje > 0
            ? (totalHoje + (totalHoje === 1 ? ' aula neste dia' : ' aulas seguidas neste dia'))
            : 'Nenhuma aula neste dia';

        document.querySelectorAll('.check-periodo').forEach(function (checkbox) {
            var periodo = parseInt(checkbox.getAttribute('data-periodo'), 10);
            var envolvido = periodo <= totalHoje;
            var item = checkbox.closest('span');

            item.hidden = !envolvido;
            checkbox.disabled = !envolvido;
        });
    }

    iniciarCalendario({
        dataInputId: 'dataSelecionada',
        dataTextoId: 'dataSelecionadaTexto',
        diasPermitidos: diasPermitidos,
        onSelecionar: atualizarPeriodosVisiveis
    });
</script>

</body>
</html>
