<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'College Squire - ' + ${disciplina.nome}">College Squire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app-shell">

    <div class="fundo-padrao"></div>

    <header class="app-header">
        <div th:replace="~{fragments/brasao :: brasao}"></div>
        <div class="marca">
            <strong th:text="${disciplina.nome}"></strong>
            <span th:text="${disciplina.turma != null ? 'Turma ' + disciplina.turma.numero + (disciplina.turma.curso != null ? ' - ' + disciplina.turma.curso.nome : '') : ''}"></span>
        </div>
        <div class="usuario">
            <a class="btn-sair" th:href="@{/home}">Voltar</a>
        </div>
    </header>

    <main class="app-content">

        <section class="painel">
            <h2>Alunos matriculados</h2>

            <table class="tabela-grade" th:if="${not #lists.isEmpty(alunos)}">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Matricula</th>
                    <th>E-mail</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${alunos}">
                    <td th:text="${a.nome}"></td>
                    <td th:text="${a.matricula}"></td>
                    <td th:text="${a.email}"></td>
                    <td class="acoes">
                        <a class="btn btn-secundario" th:href="@{/professor/alunos/{id}(id=${a.id}, disciplinaId=${disciplina.id})}">Ver perfil</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <p class="tabela-vazia" th:if="${#lists.isEmpty(alunos)}">Nenhum aluno matriculado nesta turma.</p>
        </section>

        <section class="painel" th:if="${not #lists.isEmpty(alunos)}">
            <h2>Lancar nota</h2>

            <form class="form-inline" th:action="@{/professor/disciplinas/{id}/notas(id=${disciplina.id})}" method="post">
                <div class="input-group">
                    <label>Aluno</label>
                    <select name="alunoId" required>
                        <option th:each="a : ${alunos}" th:value="${a.id}" th:text="${a.nome}"></option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Avaliacao</label>
                    <input type="text" name="descricao" placeholder="Prova 1" required>
                </div>
                <div class="input-group">
                    <label>Tipo</label>
                    <input type="text" name="tipo" placeholder="Prova" required>
                </div>
                <div class="input-group">
                    <label>Peso</label>
                    <input type="number" step="0.1" name="peso" value="1" required>
                </div>
                <div class="input-group">
                    <label>Nota</label>
                    <input type="number" step="0.1" name="valor" required>
                </div>
                <button type="submit" class="btn btn-primario">Lancar</button>
            </form>
        </section>

        <section class="painel" th:if="${not #lists.isEmpty(alunos)}">
            <h2>Lancar frequencia</h2>

            <form class="form-inline" th:action="@{/professor/disciplinas/{id}/frequencia(id=${disciplina.id})}" method="post">
                <div class="input-group">
                    <label>Aluno</label>
                    <select name="alunoId" required>
                        <option th:each="a : ${alunos}" th:value="${a.id}" th:text="${a.nome}"></option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Data</label>
                    <input type="date" name="data" required>
                </div>
                <div class="input-group checkbox">
                    <label>Presente</label>
                    <input type="checkbox" name="presente" value="true">
                </div>
                <button type="submit" class="btn btn-primario">Lancar</button>
            </form>
        </section>

        <section class="painel">
            <h2>Notas lancadas</h2>

            <table class="tabela-grade" th:if="${not #lists.isEmpty(notas)}">
                <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Avaliacao</th>
                    <th>Tipo</th>
                    <th>Peso</th>
                    <th>Nota</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="n : ${notas}">
                    <td th:text="${n.aluno.nome}"></td>
                    <td th:text="${n.descricao}"></td>
                    <td th:text="${n.tipo}"></td>
                    <td th:text="${n.peso}"></td>
                    <td th:text="${n.valor}"></td>
                </tr>
                </tbody>
            </table>

            <p class="tabela-vazia" th:if="${#lists.isEmpty(notas)}">Nenhuma nota lancada ainda.</p>
        </section>

        <section class="painel">
            <h2>Frequencia lancada</h2>

            <table class="tabela-grade" th:if="${not #lists.isEmpty(frequencias)}">
                <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Data</th>
                    <th>Presenca</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${frequencias}">
                    <td th:text="${f.aluno.nome}"></td>
                    <td th:text="${f.data}"></td>
                    <td th:text="${f.presente} ? 'Presente' : 'Falta'"></td>
                </tr>
                </tbody>
            </table>

            <p class="tabela-vazia" th:if="${#lists.isEmpty(frequencias)}">Nenhuma frequencia lancada ainda.</p>
        </section>

    </main>

</div>

</body>
</html>
