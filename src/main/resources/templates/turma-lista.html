<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}" lang="pt-br">
<body>

<div layout:fragment="conteudo">

    <div class="admin-toolbar">
        <h2>Turmas cadastradas</h2>
        <a class="btn btn-primario" th:href="@{/turmas/novo}">Inserir</a>
    </div>

    <table class="tabela-grade" th:if="${not #lists.isEmpty(turmas)}">
        <thead>
        <tr>
            <th>Numero</th>
            <th>Curso</th>
            <th>Periodo</th>
            <th class="col-acoes"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${turmas}">
            <td th:text="${t.numero}"></td>
            <td th:text="${t.curso != null ? t.curso.nome : '-'}"></td>
            <td th:text="${t.periodo}"></td>
            <td class="col-acoes">
                <a class="btn-icone" th:href="@{/turmas/editar/{id}(id=${t.id})}" title="Editar">&#9998;</a>
                <a class="btn-icone excluir" th:href="@{/turmas/deletar/{id}(id=${t.id})}" title="Excluir"
                   onclick="return confirm('Excluir este registro?')">&#10006;</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="tabela-vazia" th:if="${#lists.isEmpty(turmas)}">Nenhuma turma cadastrada ainda.</p>

</div>

</body>
</html>
