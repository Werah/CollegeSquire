<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}" lang="pt-br">
<body>

<div layout:fragment="conteudo">

    <div class="admin-form">
        <h2 th:text="${aluno.id} != null ? 'Editar aluno' : 'Novo aluno'"></h2>

        <form th:action="@{/alunos}" th:object="${aluno}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="input-group">
                <label>Nome</label>
                <input type="text" th:field="*{nome}" required>
            </div>
            <div class="input-group">
                <label>Matricula</label>
                <input type="text" th:field="*{matricula}" required>
            </div>
            <div class="input-group">
                <label>Curso</label>
                <select th:field="*{curso}">
                    <option value="">Selecione...</option>
                    <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nome}"></option>
                </select>
            </div>
            <div class="input-group">
                <label>Turma</label>
                <select th:field="*{turma}" required>
                    <option value="">Selecione...</option>
                    <option th:each="t : ${turmas}" th:value="${t.id}"
                            th:attr="data-curso=${t.curso != null ? t.curso.id : ''}"
                            th:text="'Turma ' + ${t.numero} + (${t.curso} != null ? ' - ' + ${t.curso.nome} : '')"></option>
                </select>
            </div>
            <div class="input-group">
                <label>CPF</label>
                <input type="text" th:field="*{cpf}" data-validar="cpf" required>
            </div>
            <div class="input-group">
                <label>Endereco</label>
                <input type="text" th:field="*{endereco}">
            </div>
            <div class="input-group">
                <label>Telefone</label>
                <input type="text" th:field="*{telefone}">
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" th:field="*{email}" required>
            </div>
            <div class="input-group">
                <label th:text="${aluno.id} != null ? 'Nova senha' : 'Senha'"></label>
                <input type="password" th:field="*{senha}" th:required="${aluno.id} == null">
                <small th:if="${aluno.id} != null">Deixe em branco para manter a senha atual.</small>
            </div>
            <div class="botoes">
                <button type="submit" class="btn btn-primario">Salvar</button>
                <a class="btn btn-secundario" th:href="@{/alunos}">Cancelar</a>
            </div>
        </form>
    </div>

    <script>
        // So mostra no seletor de turma as turmas do curso escolhido.
        (function () {
            var curso = document.querySelector('select[name=curso]');
            var turma = document.querySelector('select[name=turma]');

            var turmas = Array.prototype.map.call(turma.querySelectorAll('option[data-curso]'), function (o) {
                return {value: o.value, texto: o.textContent, curso: o.getAttribute('data-curso')};
            });

            function filtrar() {
                var atual = turma.value;
                var cursoId = curso.value;

                turma.innerHTML = '';

                var vazio = document.createElement('option');
                vazio.value = '';
                vazio.textContent = cursoId ? 'Selecione...' : 'Selecione um curso primeiro';
                turma.appendChild(vazio);

                turmas.forEach(function (t) {
                    if (cursoId && t.curso === cursoId) {
                        var opcao = document.createElement('option');
                        opcao.value = t.value;
                        opcao.textContent = t.texto;
                        opcao.setAttribute('data-curso', t.curso);
                        turma.appendChild(opcao);
                    }
                });

                var aindaValida = Array.prototype.some.call(turma.options, function (o) {
                    return o.value === atual && atual !== '';
                });
                turma.value = aindaValida ? atual : '';
                turma.dispatchEvent(new Event('change', {bubbles: true}));
            }

            curso.addEventListener('change', filtrar);
            filtrar();
        })();
    </script>

</div>

</body>
</html>
